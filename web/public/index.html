<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cửa hàng điện máy</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --text: #1b1f24;
      --muted: #5b6573;
      --border: #e2e5ea;
      --accent: #1f6feb;
      --accent-text: #ffffff;
      --price: #c2410c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1216;
        --surface: #171b21;
        --text: #e6e9ee;
        --muted: #9aa4b2;
        --border: #2a313b;
        --accent: #4c8dff;
        --accent-text: #0f1216;
        --price: #fb923c;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header, main { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
    header { padding-top: 32px; padding-bottom: 8px; }
    h1 { margin: 0 0 4px; font-size: 1.75rem; }
    .subtitle { margin: 0; color: var(--muted); }

    .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0; }
    .tab {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 999px;
      font: inherit;
      cursor: pointer;
    }
    .tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
    .tab .count { opacity: .7; margin-left: 4px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
      padding-bottom: 40px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .card img { width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--border); display: block; }
    .card-body { padding: 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .category { font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .name { margin: 0; font-size: 1rem; }
    .price { font-weight: 700; color: var(--price); font-size: 1.1rem; }
    .desc { margin: 0; color: var(--muted); font-size: .9rem; }
    .status { color: var(--muted); padding: 24px 0; }
  </style>
</head>
<body>
  <header>
    <h1>Cửa hàng điện máy</h1>
    <p class="subtitle">Dữ liệu đọc trực tiếp từ bảng <code>products</code> và <code>categories</code>.</p>
  </header>
  <main>
    <nav class="tabs" id="tabs" aria-label="Lọc theo loại"></nav>
    <p class="status" id="status">Đang tải…</p>
    <section class="grid" id="grid"></section>
  </main>

  <script>
    const tabsEl = document.getElementById('tabs');
    const gridEl = document.getElementById('grid');
    const statusEl = document.getElementById('status');
    const vnd = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' });
    let current = null;

    async function getJson(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error ?? res.statusText);
      return res.json();
    }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function renderTabs(categories) {
      const total = categories.reduce((sum, c) => sum + c.product_count, 0);
      const items = [{ id: null, name: 'Tất cả', product_count: total }, ...categories];
      tabsEl.replaceChildren(...items.map((c) => {
        const btn = el('button', 'tab', c.name);
        btn.type = 'button';
        btn.setAttribute('aria-pressed', String(c.id === current));
        btn.append(el('span', 'count', `(${c.product_count})`));
        btn.addEventListener('click', () => {
          current = c.id;
          renderTabs(categories);
          loadProducts();
        });
        return btn;
      }));
    }

    function renderProducts(products) {
      gridEl.replaceChildren(...products.map((p) => {
        const card = el('article', 'card');
        const img = el('img');
        img.src = p.image ?? '';
        img.alt = p.name;
        img.loading = 'lazy';
        const body = el('div', 'card-body');
        body.append(
          el('span', 'category', p.category_name),
          el('h2', 'name', p.name),
          el('span', 'price', vnd.format(p.price)),
          el('p', 'desc', p.description ?? ''),
        );
        card.append(img, body);
        return card;
      }));
      statusEl.textContent = products.length ? '' : 'Chưa có sản phẩm nào.';
      statusEl.hidden = products.length > 0;
    }

    async function loadProducts() {
      try {
        const url = current === null ? '/api/products' : `/api/products?category=${current}`;
        renderProducts(await getJson(url));
      } catch (err) {
        statusEl.hidden = false;
        statusEl.textContent = `Không tải được sản phẩm: ${err.message}`;
      }
    }

    (async () => {
      try {
        renderTabs(await getJson('/api/categories'));
        await loadProducts();
      } catch (err) {
        statusEl.textContent = `Không tải được dữ liệu: ${err.message}`;
      }
    })();
  </script>
</body>
</html>
